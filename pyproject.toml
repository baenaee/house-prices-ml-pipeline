[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "houseprices"
version = "0.1.0"
description = "Kaggle House Prices (Ames) - reproducible cleaning, validation and modelling research"
requires-python = ">=3.12"
# Runtime dependencies are pinned in requirements.txt / environment.yml.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
