<line x1='935' y1='368' x2='130' y2='428' stroke='#52514e' stroke-width='1.6' marker-end='url(#ah)' stroke-dasharray='5,4'/>
<text x='700' y='405' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='1' font-weight='400' fill='#52514e'></text>
<rect x='30' y='560' width='22' height='16' rx='4' fill='#eef8f3' stroke='#1baf7a'/>
<text x='60' y='573' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#52514e'>deterministic data step</text>
<rect x='290' y='560' width='22' height='16' rx='4' fill='#f3f7fd' stroke='#2a78d6'/>
<text x='320' y='573' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#52514e'>fitted inside each CV fold</text>
<rect x='550' y='560' width='22' height='16' rx='4' fill='#fdf1ec' stroke='#eb6834'/>
<text x='580' y='573' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#52514e'>decision / guarded step</text>
<text x='810' y='573' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#eb6834'>holdout rows stay locked until step 3</text>
<text x='30' y='610' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#8a8984'>Every arrow out of a blue box is reproducible from the registry with one command; the holdout is guarded in code and was used exactly once.</text></svg>