<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 640' width='1100' height='640'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#52514e'/></marker></defs><rect width='1100' height='640' fill='white'/><text x='30' y='30' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>1  DATA (runs once, row-wise only)</text>
<rect x='30' y='45' width='180' height='70' rx='8' fill='#eef8f3' stroke='#1baf7a' stroke-width='1.5'/>
<text x='120.0' y='67' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>train.csv / test.csv</text>
<text x='120.0' y='85' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>1,460 + 1,459 houses</text>
<text x='120.0' y='100' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>79 columns</text>
<rect x='250' y='45' width='190' height='70' rx='8' fill='#eef8f3' stroke='#1baf7a' stroke-width='1.5'/>
<text x='345.0' y='67' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Cleaning</text>
<text x='345.0' y='85' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>17 deterministic rules</text>
<text x='345.0' y='100' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>semantic fills, no stats</text>
<rect x='480' y='45' width='190' height='70' rx='8' fill='#fdf1ec' stroke='#eb6834' stroke-width='1.5'/>
<text x='575.0' y='67' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Holdout split</text>
<text x='575.0' y='85' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>219 rows locked (15 %)</text>
<text x='575.0' y='100' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>stratified by price decile</text>
<rect x='710' y='45' width='190' height='70' rx='8' fill='#eef8f3' stroke='#1baf7a' stroke-width='1.5'/>
<text x='805.0' y='67' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Feature groups</text>
<text x='805.0' y='85' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>areas, baths, ages,</text>
<text x='805.0' y='100' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>quality x size interactions</text>
<rect x='940' y='45' width='140' height='70' rx='8' fill='#eef8f3' stroke='#1baf7a' stroke-width='1.5'/>
<text x='1010.0' y='67' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Target</text>
<text x='1010.0' y='85' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>y = log1p(price)</text>
<line x1='210' y1='80' x2='250' y2='80' stroke='#52514e' stroke-width='1.6' marker-end='url(#ah)'/>
<line x1='440' y1='80' x2='480' y2='80' stroke='#52514e' stroke-width='1.6' marker-end='url(#ah)'/>
<line x1='670' y1='80' x2='710' y2='80' stroke='#52514e' stroke-width='1.6' marker-end='url(#ah)'/>
<line x1='900' y1='80' x2='940' y2='80' stroke='#52514e' stroke-width='1.6' marker-end='url(#ah)'/>
<text x='30' y='165' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>2  EXPERIMENTS on 1,241 development rows (everything that learns is fitted inside each training fold)</text>
<rect x='30' y='178' width='1050' height='190' rx='12' fill='none' stroke='#2a78d6' stroke-dasharray='6,5' stroke-width='1.5'/>
<text x='45' y='200' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='700' fill='#2a78d6'>for each of 5 folds:  clone(pipeline) → fit on 4/5 → predict 1/5</text>
<rect x='50' y='215' width='210' height='135' rx='8' fill='#f3f7fd' stroke='#2a78d6' stroke-width='1.5'/>
<text x='155.0' y='237' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Preprocess (in fold)</text>
<text x='155.0' y='255' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>LotFrontage: nbhd median</text>
<text x='155.0' y='270' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>log1p of skewed columns</text>
<text x='155.0' y='285' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>one-hot encoding</text>
<text x='155.0' y='300' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>scaling (linear models)</text>
<rect x='300' y='215' width='230' height='135' rx='8' fill='#f3f7fd' stroke='#2a78d6' stroke-width='1.5'/>
<text x='415.0' y='237' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Model</text>
<text x='415.0' y='255' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>OLS / Ridge / Lasso / ElasticNet</text>
<text x='415.0' y='270' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>XGBoost / LightGBM / CatBoost</text>
<text x='415.0' y='285' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>Optuna TPE: 180 trials</text>
<text x='415.0' y='300' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>ensembles (nested stacking)</text>
<rect x='570' y='215' width='200' height='135' rx='8' fill='#f3f7fd' stroke='#2a78d6' stroke-width='1.5'/>
<text x='670.0' y='237' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Score</text>
<text x='670.0' y='255' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>RMSE on log scale</text>
<text x='670.0' y='270' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>5 fold scores</text>
<text x='670.0' y='285' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>mean + paired diffs</text>
<text x='670.0' y='300' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>finite-check guard</text>
<rect x='810' y='215' width='250' height='135' rx='8' fill='#f3f7fd' stroke='#2a78d6' stroke-width='1.5'/>
<text x='935.0' y='237' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Experiment registry</text>
<text x='935.0' y='255' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>83 runs, E001-E083</text>
<text x='935.0' y='270' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>builder + args + seed + hash</text>
<text x='935.0' y='285' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>reproduce: evaluate --experiment</text>
<text x='935.0' y='300' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>217 tests, 36 audit findings</text>
<line x1='260' y1='282' x2='300' y2='282' stroke='#52514e' stroke-width='1.6' marker-end='url(#ah)'/>
<line x1='530' y1='282' x2='570' y2='282' stroke='#52514e' stroke-width='1.6' marker-end='url(#ah)'/>
<line x1='770' y1='282' x2='810' y2='282' stroke='#52514e' stroke-width='1.6' marker-end='url(#ah)'/>
<line x1='985' y1='115' x2='985' y2='176' stroke='#52514e' stroke-width='1.6' marker-end='url(#ah)'/>
<text x='30' y='415' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>3  SELECTION, FREEZE AND DELIVERY</text>
<rect x='30' y='430' width='200' height='85' rx='8' fill='#fdf1ec' stroke='#eb6834' stroke-width='1.5'/>
<text x='130.0' y='452' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>8 finalists</text>
<text x='130.0' y='470' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>re-scored on 15 fresh folds</text>
<text x='130.0' y='485' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>(seed 7): optimism 0.003</text>
<rect x='270' y='430' width='200' height='85' rx='8' fill='#fdf1ec' stroke='#eb6834' stroke-width='1.5'/>
<text x='370.0' y='452' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Pre-registered rule</text>
<text x='370.0' y='470' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>ensemble must win by</text>
<text x='370.0' y='485' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>&gt;= 0.001 and &gt; 1 SE</text>
<rect x='510' y='430' width='180' height='85' rx='8' fill='#fdf1ec' stroke='#eb6834' stroke-width='1.5'/>
<text x='600.0' y='452' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Freeze E066</text>
<text x='600.0' y='470' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>single CatBoost</text>
<text x='600.0' y='485' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>Git commit + audit OK</text>
<rect x='730' y='430' width='160' height='85' rx='8' fill='#fdf1ec' stroke='#eb6834' stroke-width='1.5'/>
<text x='810.0' y='452' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Holdout, once</text>
<text x='810.0' y='470' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>the 219 locked rows</text>
<text x='810.0' y='485' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>RMSE 0.1065 (CV ~0.12)</text>
<rect x='930' y='430' width='150' height='85' rx='8' fill='#fdf1ec' stroke='#eb6834' stroke-width='1.5'/>
<text x='1005.0' y='452' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Final fit</text>
<text x='1005.0' y='470' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>all 1,460 rows</text>
<text x='1005.0' y='485' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>→ submission.csv</text>
