<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 380' width='1000' height='380'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#52514e'/></marker></defs><rect width='1000' height='380' fill='white'/><text x='30' y='30' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#0b0b0b'>Nested stacking: how the meta-learner avoids seeing its own validation rows</text>
<rect x='30' y='55' width='260' height='80' rx='8' fill='#f3f7fd' stroke='#2a78d6' stroke-width='1.5'/>
<text x='160.0' y='77' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Outer training fold</text>
<text x='160.0' y='95' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>~993 rows (4 of 5 outer folds)</text>
<rect x='30' y='255' width='260' height='80' rx='8' fill='#fdf1ec' stroke='#eb6834' stroke-width='1.5'/>
<text x='160.0' y='277' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Outer validation fold</text>
<text x='160.0' y='295' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>~248 rows: only predicted, never fitted</text>
<rect x='350' y='45' width='290' height='100' rx='8' fill='#f3f7fd' stroke='#2a78d6' stroke-width='1.5'/>
<text x='495.0' y='67' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Inner 5-fold CV</text>
<text x='495.0' y='85' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>fit Lasso and CatBoost on inner-train</text>
<text x='495.0' y='100' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>predict inner-validation</text>
<text x='495.0' y='115' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>→ out-of-fold predictions for every row</text>
<rect x='700' y='45' width='270' height='100' rx='8' fill='#f3f7fd' stroke='#2a78d6' stroke-width='1.5'/>
<text x='835.0' y='67' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Meta-learner (Ridge / NNLS)</text>
<text x='835.0' y='85' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>learns weights from OOF predictions</text>
<text x='835.0' y='100' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>(never from in-sample fits)</text>
<rect x='700' y='185' width='270' height='70' rx='8' fill='#f3f7fd' stroke='#2a78d6' stroke-width='1.5'/>
<text x='835.0' y='225.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='700' fill='#0b0b0b'>Refit bases on all outer-train rows</text>
<rect x='350' y='255' width='290' height='80' rx='8' fill='#fdf1ec' stroke='#eb6834' stroke-width='1.5'/>
<text x='495.0' y='277' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Score</text>
<text x='495.0' y='295' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>meta(bases(outer validation))</text>
<text x='495.0' y='310' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>→ one honest fold score</text>
<line x1='290' y1='95' x2='350' y2='95' stroke='#52514e' stroke-width='1.6' marker-end='url(#ah)'/>
<line x1='640' y1='95' x2='700' y2='95' stroke='#52514e' stroke-width='1.6' marker-end='url(#ah)'/>
<line x1='835' y1='145' x2='835' y2='185' stroke='#52514e' stroke-width='1.6' marker-end='url(#ah)'/>
<line x1='835' y1='255' x2='640' y2='295' stroke='#52514e' stroke-width='1.6' marker-end='url(#ah)'/>
<line x1='290' y1='295' x2='350' y2='295' stroke='#52514e' stroke-width='1.6' marker-end='url(#ah)'/>
<text x='30' y='365' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#8a8984'>In code this is automatic: the ensemble is an ordinary estimator whose fit() runs the inner CV, so the outer cross_validate() nests it.</text></svg>