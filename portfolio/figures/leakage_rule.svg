<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 300' width='1000' height='300'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#52514e'/></marker></defs><rect width='1000' height='300' fill='white'/><text x='30' y='30' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#0b0b0b'>The leakage rule: which steps may run before cross-validation?</text>
<rect x='30' y='50' width='450' height='210' rx='8' fill='#eef8f3' stroke='#1baf7a' stroke-width='1.5'/>
<text x='255.0' y='72' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Safe OUTSIDE the fold</text>
<text x='255.0' y='90' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>output for a row depends on that row only</text>
<text x='255.0' y='105' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'></text>
<text x='255.0' y='120' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>TotalSF = TotalBsmtSF + 1stFlrSF + 2ndFlrSF</text>
<text x='255.0' y='135' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>OverallQual x GrLivArea</text>
<text x='255.0' y='150' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>GarageType missing &amp; GarageArea = 0 → 'None'</text>
<text x='255.0' y='165' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>quality labels → ordered numbers</text>
<text x='255.0' y='180' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>log1p of the target</text>
<rect x='520' y='50' width='450' height='210' rx='8' fill='#fdf1ec' stroke='#eb6834' stroke-width='1.5'/>
<text x='745.0' y='72' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#0b0b0b'>Must be INSIDE the fold</text>
<text x='745.0' y='90' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>output depends on statistics of other rows</text>
<text x='745.0' y='105' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'></text>
<text x='745.0' y='120' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>LotFrontage ← neighbourhood median</text>
<text x='745.0' y='135' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>which columns are 'skewed' (&gt; 0.75)</text>
<text x='745.0' y='150' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>one-hot categories, scaler mean / sd</text>
<text x='745.0' y='165' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>outlier removal (training side only)</text>
<text x='745.0' y='180' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>ensemble weights, meta-learner, hyper-parameters</text>
<text x='30' y='288' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#8a8984'>Implemented as a scikit-learn Pipeline cloned and refitted per fold: leakage safety is a property of the structure, not of discipline.</text></svg>